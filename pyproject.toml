[project]
name = "srotas-clinical-extraction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "openai>=3.26.1",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "pypdf>=6.20.0",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
hybrid = [
    # scispaCy NER on spaCy 3.7.x. Pin numpy 1.26 to avoid Windows thinc ABI
    # clashes with numpy 2.x. medspaCy omitted (broken Windows builds); ConText
    # uses src/hybrid/context_local.py instead.
    "numpy==1.26.4",
    "spacy==3.7.5",
    "scispacy==0.5.5",
    "click>=8.0",
]
